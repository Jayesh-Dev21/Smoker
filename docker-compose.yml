services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    ports:
      - "8545:8545"
    command: anvil -a 0.0.0.0 -p 8545
    environment:
      - ANVIL_IP_ADDR=0.0.0.0
    networks:
      - smoker

  contracts:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    depends_on:
      anvil:
        condition: service_started
    volumes:
      - shared-data:/shared
    environment:
      - ETH_RPC_URL=http://anvil:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    networks:
      - smoker

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - shared-data:/shared
    environment:
      - ETH_RPC_URL=http://anvil:8545
      - PRIVATE_KEY=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
    depends_on:
      contracts:
        condition: service_completed_successfully
    networks:
      - smoker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - smoker

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - shared-data:/shared
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - ETH_RPC_URL=http://anvil:8545
      - DASHBOARD_URL=http://dashboard:3002
    depends_on:
      contracts:
        condition: service_completed_successfully
    networks:
      - smoker

volumes:
  shared-data:

networks:
  smoker:
    driver: bridge
